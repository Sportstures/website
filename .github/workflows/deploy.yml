name: Build website

# Builds the site against the live backend and publishes the result to the `web-build` branch.
# A Render static site (or any static host) serves that branch, so Flutter is only needed here.
# GitHub Pages is not used: it needs a public repo or a paid plan.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-build
  cancel-in-progress: true

env:
  API_BASE_URL: https://sportstures-backend.onrender.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Publish build/web to the web-build branch
        working-directory: build/web
        run: |
          git init -q -b web-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web-build
